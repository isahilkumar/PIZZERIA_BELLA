# ==============================================================================
# 🍕 Pizzeria Bella - Render Blueprint Specification (Single Fullstack Service)
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Single Unified Fullstack Web Service (Frontend SPA + Backend API + WebSockets)
  # Uses exactly 1 service slot to fit within Render's 25 service account limit
  # ----------------------------------------------------------------------------
  - type: web
    name: pizzeria-bella
    runtime: node
    plan: free
    buildCommand: cd backend && npm install && cd ../frontend && npm install && npm run build
    startCommand: node backend/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_EMAIL
        value: kumarsahil4447@gmail.com
      - key: DEFAULT_STOCK_THRESHOLD
        value: "20"
      - key: CRON_SCHEDULE
        value: "*/30 * * * *"
      - key: EMAIL_SERVICE
        value: gmail
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: kumarsahil4447@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: Pizzeria Bella <kumarsahil4447@gmail.com>
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
